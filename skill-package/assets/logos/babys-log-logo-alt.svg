<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB3D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8FAB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  
  <!-- White circle background for icon -->
  <circle cx="256" cy="256" r="180" fill="#FFFFFF"/>
  
  <!-- Baby bottle - simplified design -->
  <g transform="translate(256, 256)">
    <!-- Bottle body -->
    <rect x="-45" y="-20" width="90" height="120" rx="12" fill="url(#bottleGrad)" stroke="#FF6B9D" stroke-width="4"/>
    
    <!-- Bottle cap -->
    <rect x="-35" y="-50" width="70" height="30" rx="6" fill="#FF6B9D"/>
    
    <!-- Nipple -->
    <path d="M -20 -50 L -20 -70 Q 0 -80 20 -70 L 20 -50 Z" fill="#FFD6E8" stroke="#FF6B9D" stroke-width="2"/>
    
    <!-- Milk level with wave -->
    <path d="M -35 30 Q -20 25 0 30 T 35 30 L 35 90 Q 35 95 30 95 L -30 95 Q -35 95 -35 90 Z" fill="#E8F4FF" opacity="0.9"/>
    
    <!-- Measurement marks -->
    <line x1="48" y1="0" x2="58" y2="0" stroke="#4A90E2" stroke-width="2.5"/>
    <line x1="48" y1="30" x2="58" y2="30" stroke="#4A90E2" stroke-width="2.5"/>
    <line x1="48" y1="60" x2="58" y2="60" stroke="#4A90E2" stroke-width="2.5"/>
    <text x="65" y="5" font-family="Arial, sans-serif" font-size="16" fill="#4A90E2" font-weight="bold">ml</text>
    
    <!-- Checkmark badge -->
    <circle cx="-60" cy="60" r="28" fill="#34A853"/>
    <path d="M -70 60 L -62 68 L -50 52" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Bottom text arc (optional - remove if too busy) -->
  <path id="textPath" d="M 100 400 Q 256 440 412 400" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      Baby's Log
    </textPath>
  </text>
</svg>